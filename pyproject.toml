# pyproject.toml
[tool.ruff]
target-version = "py311"
line-length = 100
exclude = [".venv", "venvCreditRisk-Test", "reports", "__pycache__"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
ignore = ["E501"]  # line-too-long (géré par formatter)

[tool.ruff.format]
quote-style = "double"